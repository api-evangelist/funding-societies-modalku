name: Funding Societies | Modalku
description: >-
  Funding Societies (known as Modalku in Indonesia) is Southeast Asia's largest
  SME digital financing and investment platform, connecting small and medium
  enterprises seeking working capital with individual and institutional
  investors. Operating across Singapore, Indonesia, Malaysia, Thailand, Vietnam
  and Hong Kong, the platform offers micro loans, business term loans, invoice
  and accounts-payable/receivable financing, startup financing and
  property-backed secured lending, alongside investment products for lenders. It
  is licensed and regulated (Capital Markets Services License, Monetary
  Authority of Singapore) and was surfaced as a 500 Global portfolio company and
  added to the API Evangelist network. No public developer API, documentation,
  or developer portal is currently published.
